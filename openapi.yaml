openapi: 3.1.0
info:
  title: atc-render
  version: "1.0.0"
  description: >
    PDF rendering from versioned JSON layout templates. A template has immutable numbered
    versions; each is a layout (page size, margins, header/footer with page numbers, blocks:
    heading, text with `{{path}}` placeholders and **bold**/_italic_ runs, keyValue, table with
    header repeat across pages, image, qr, divider, spacer, pageBreak, and `if` on any block).
    Rendering returns `application/pdf` as an attachment, or stores a private atc-media file.
    Fonts are the vendored DejaVu family, so Turkish and other Latin, Greek and Cyrillic text
    renders.


    Auth: every `/v1/*` and `/metrics` route requires `Authorization: Bearer <api-key>`: `read`
    renders, `write` manages templates and previews, `readwrite` both. Layouts are validated
    against the `Layout` schema below (400 `VALIDATION_FAILED`, `details[].path` names the block);
    problems found while drawing are 422 with `details.block`.
servers:
  - url: /
security:
  - ApiKeyAuth: []
tags:
  - name: templates
  - name: render
  - name: jobs
  - name: stats
  - name: ops
paths:
  /openapi.yaml:
    get:
      operationId: atc-render.openapi
      summary: Download the canonical OpenAPI document
      security: []
      responses:
        "200":
          description: Canonical OpenAPI document.
          content:
            text/yaml:
              schema: { type: string }

  /health:
    get:
      operationId: atc-render.health.get
      summary: Liveness probe
      tags: [ops]
      security: []
      x-stack-visibility: public
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } }

  /ready:
    get:
      operationId: atc-render.ready.get
      summary: Readiness probe
      description: Database ping, cached for 10 seconds.
      tags: [ops]
      security: []
      x-stack-visibility: public
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } }
        "503":
          description: The cached readiness check last failed.
          content:
            application/json:
              schema: { type: object, required: [status, error], properties: { status: { type: string, enum: [unavailable] }, error: { type: string } } }

  /v1/info:
    get:
      operationId: atc-render.info.get
      summary: Service identity and capabilities
      tags: [ops]
      security: []
      x-stack-visibility: public
      responses:
        "200":
          description: Instance identity.
          content:
            application/json:
              schema:
                type: object
                required: [service, version, apiVersion, capabilities, schemaVersion, serviceCore]
                properties:
                  service: { type: string, const: atc-render }
                  version: { type: string, description: "This service's own package.json semver." }
                  apiVersion: { type: string, const: v1 }
                  capabilities: { type: array, items: { type: string }, description: "`pdf`, `versioned-templates`, `unicode-fonts`, `tables`, `qr`, `images-base64`, plus `images-media` and `store-media` when media is configured." }
                  schemaVersion: { type: integer, description: "SQLite PRAGMA user_version of the open database." }
                  serviceCore: { type: string, description: "@atc-web/atc-service-core version actually running." }

  /metrics:
    get:
      operationId: atc-render.metrics.get
      summary: Prometheus text-format metrics
      description: Requires a `read`-capable API key. Not rate-limited.
      tags: [ops]
      x-stack-visibility: operational
      responses:
        "200":
          description: "`render_templates`, `render_renders_24h{outcome}`, `render_failures_24h{code}`, `render_avg_ms_24h`, `render_pages_24h`, `render_bytes_24h`, `render_in_flight`, `render_busy_total` (process-local), `render_process_uptime_seconds`."
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/templates:
    get:
      operationId: atc-render.templates.list
      summary: List templates
      tags: [templates]
      responses:
        "200":
          description: Every template, by name.
          content:
            application/json:
              schema: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: "#/components/schemas/Template" } }, nextCursor: { type: "null", description: Always null; the list is complete. } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: atc-render.templates.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: Create a template with its first version
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, layout]
              properties:
                name: { $ref: "#/components/schemas/TemplateName" }
                description: { type: string, maxLength: 500 }
                layout: { $ref: "#/components/schemas/Layout" }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Created as version 1.
          headers:
            location: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, required: [template], properties: { template: { $ref: "#/components/schemas/Template" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /v1/templates/{name}:
    parameters:
      - $ref: "#/components/parameters/NameParam"
    get:
      operationId: atc-render.templates.get
      summary: One template with its version list
      tags: [templates]
      responses:
        "200":
          description: The template and its versions, newest first (without layouts).
          content:
            application/json:
              schema:
                type: object
                required: [template, versions]
                properties:
                  template: { $ref: "#/components/schemas/Template" }
                  versions: { type: array, items: { $ref: "#/components/schemas/Version" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: atc-render.templates.update
      summary: Change the description
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [description], properties: { description: { type: string, maxLength: 500 } } }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, required: [template], properties: { template: { $ref: "#/components/schemas/Template" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: atc-render.templates.delete
      summary: Delete a template and every version
      description: Irreversible. Stored PDFs in media are not affected.
      tags: [templates]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/templates/{name}/versions:
    parameters:
      - $ref: "#/components/parameters/NameParam"
    post:
      operationId: atc-render.versions.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: Publish a new immutable version
      description: The new version becomes the latest; versions beyond `MAX_VERSIONS` (100) are pruned, oldest first. Numbers are never reused.
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [layout]
              properties:
                layout: { $ref: "#/components/schemas/Layout" }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The new version.
          content:
            application/json:
              schema: { type: object, required: [version], properties: { version: { $ref: "#/components/schemas/VersionWithLayout" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /v1/templates/{name}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/NameParam"
      - { name: version, in: path, required: true, schema: { type: string, pattern: "^[1-9][0-9]{0,8}$" } }
    get:
      operationId: atc-render.versions.get
      summary: One version with its layout
      tags: [templates]
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { type: object, required: [version], properties: { version: { $ref: "#/components/schemas/VersionWithLayout" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/render:
    post:
      operationId: atc-render.render.create
      summary: Render a template version with data
      description: >
        Latest version unless `version` is given. `store: false` (default) answers the PDF as an
        attachment (`content-security-policy: default-src 'none'; sandbox`, `x-render-pages`);
        `store: true` writes a private atc-media file and answers its id and a signed URL valid
        `DOWNLOAD_TTL_SEC`. 429 `BUSY` when all `RENDER_CONCURRENCY` slots are in use.
      tags: [render]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [template]
              properties:
                template: { $ref: "#/components/schemas/TemplateName" }
                version: { type: integer, minimum: 1 }
                data: { type: object }
                filename: { type: string, minLength: 1, maxLength: 120, description: "Reduced to [A-Za-z0-9._-]; `.pdf` is appended." }
                store: { type: boolean }
      responses:
        "200":
          description: The PDF (store false).
          headers:
            content-disposition: { schema: { type: string } }
            x-render-pages: { schema: { type: string } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "201":
          description: Stored in media (store true).
          content:
            application/json:
              schema:
                type: object
                required: [fileId, url, expiresAt, pages, bytes, version]
                properties:
                  fileId: { type: string }
                  url: { type: string, format: uri }
                  expiresAt: { type: [string, "null"], format: date-time }
                  pages: { type: integer }
                  bytes: { type: integer }
                  version: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/RenderFailed" }
        "429": { $ref: "#/components/responses/Busy" }
        "502": { $ref: "#/components/responses/MediaError" }

  /v1/render/preview:
    post:
      operationId: atc-render.render.preview
      summary: Render an unsaved layout (write role)
      tags: [render]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [layout]
              properties:
                layout: { $ref: "#/components/schemas/Layout" }
                data: { type: object }
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/RenderFailed" }
        "429": { $ref: "#/components/responses/Busy" }

  /v1/fonts:
    get:
      operationId: atc-render.fonts.list
      summary: Font families a layout can name in page.font
      description: "`default` is the built-in DejaVu family used when `page.font` is absent; `items` are the FONTS_DIR families."
      tags: [templates]
      responses:
        "200":
          description: Installed families.
          content:
            application/json:
              schema:
                type: object
                required: [default, items, nextCursor]
                properties:
                  default: { type: string, const: dejavu }
                  items: { type: array, items: { type: string } }
                  nextCursor: { type: "null", description: Always null; the list is complete. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/renders:
    post:
      operationId: atc-render.jobs.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: Queue an asynchronous render
      description: >
        Same body as `POST /v1/render`. The template version is pinned now (latest unless
        `version` is given); the job is drawn in the background, at most `RENDER_JOB_CONCURRENCY`
        at a time, and kept `RENDER_JOB_HOURS` after it finishes. Poll `GET /v1/renders/{id}`.
        Only the submitting key can read the job. Role `read`.
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [template]
              properties:
                template: { $ref: "#/components/schemas/TemplateName" }
                version: { type: integer, minimum: 1 }
                data: { type: object }
                filename: { type: string, minLength: 1, maxLength: 120 }
                store: { type: boolean, description: "Store the PDF in atc-media instead of keeping it here." }
      responses:
        "202":
          description: Queued.
          headers:
            location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/Busy" }
    get:
      operationId: atc-render.jobs.list
      summary: The calling key's render jobs, newest first
      tags: [jobs]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [queued, running, succeeded, failed, cancelled] } }
        - { name: limit, in: query, required: false, description: "1-200, default 50.", schema: { type: string, pattern: "^([1-9]|[1-9][0-9]|1[0-9][0-9]|200)$" } }
        - { name: cursor, in: query, required: false, description: "Opaque `nextCursor` from the previous page.", schema: { $ref: "#/components/schemas/JobId" } }
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Job" } }
                  nextCursor: { type: [string, "null"], description: Pass as `cursor` for older jobs; null on the last page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/renders/{id}:
    get:
      operationId: atc-render.jobs.get
      summary: One render job
      tags: [jobs]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/JobId" } }
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "`JOB_NOT_FOUND` (unknown, purged, or another key's job).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /v1/renders/{id}/cancel:
    post:
      operationId: atc-render.jobs.cancel
      summary: Cancel a queued render job
      description: Only a `queued` job can be cancelled; a running one finishes (`409 INVALID_STATE`). The job stays listed as `cancelled` until retention removes it.
      tags: [jobs]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/JobId" } }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: The cancelled job.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "`JOB_NOT_FOUND` (unknown, purged, or another key's job).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "409": { description: "`INVALID_STATE`: the job is not queued.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /v1/renders/{id}/pdf:
    get:
      operationId: atc-render.jobs.pdf
      summary: The PDF of a finished job
      tags: [jobs]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/JobId" } }
      responses:
        "200":
          description: The PDF.
          headers:
            content-disposition: { schema: { type: string } }
            x-render-pages: { schema: { type: string } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "`JOB_NOT_FOUND`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "409": { description: "`JOB_NOT_READY`: queued, running, failed, or stored in media (`details.fileId`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /v1/stats:
    get:
      operationId: atc-render.stats.get
      summary: Templates and last-24h render counters
      tags: [stats]
      responses:
        "200":
          description: Summary for dashboards.
          content:
            application/json:
              schema:
                type: object
                required: [templates, last24h, active, concurrency]
                properties:
                  templates: { type: integer }
                  last24h:
                    type: object
                    properties:
                      renders: { type: integer }
                      succeeded: { type: integer }
                      failed: { type: integer }
                      avgMs: { type: integer }
                      pages: { type: integer }
                      bytes: { type: integer }
                      stored: { type: integer }
                      errors: { type: object, additionalProperties: { type: integer } }
                      byTemplate: { type: object, additionalProperties: { type: integer } }
                  active: { type: integer }
                  concurrency: { type: integer }
                  jobs:
                    type: object
                    description: Kept asynchronous jobs by status, plus RENDER_JOB_CONCURRENCY and RENDER_QUEUE_MAX.
                    properties:
                      queued: { type: integer }
                      running: { type: integer }
                      succeeded: { type: integer }
                      failed: { type: integer }
                      concurrency: { type: integer }
                      queueMax: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <secret>`. Keys are `id:secret[:role]` in `RENDER_API_KEYS`; role `read` (render), `write` (templates, preview) or `readwrite` (default)."
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: "Optional. Repeats of this POST with the same key (per API key, 24 h) replay the first 2xx answer with `Idempotent-Replayed: true` instead of running again; the same key with another method, path or body is `409 IDEMPOTENCY_MISMATCH`, while the first still runs `409 IDEMPOTENCY_IN_PROGRESS`."
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,255}$' }
    NameParam:
      name: name
      in: path
      required: true
      schema: { $ref: "#/components/schemas/TemplateName" }
  responses:
    BadRequest:
      description: "`VALIDATION_FAILED` (layout or body against the schema; `details[].path` names the block), `INVALID_LAYOUT` (template name), `UNKNOWN_FONT` (`page.font` is not a FONTS_DIR family) or `MEDIA_DISABLED`."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Unauthorized:
      description: Missing or invalid API key.
      headers: { www-authenticate: { schema: { type: string, const: Bearer } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Forbidden:
      description: The key's role does not permit this operation (`FORBIDDEN`).
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: "`TEMPLATE_NOT_FOUND` or `VERSION_NOT_FOUND`."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Conflict:
      description: "`TEMPLATE_EXISTS`."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    TooLarge:
      description: "`DATA_TOO_LARGE` or `LAYOUT_TOO_LARGE`."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    RenderFailed:
      description: "`RENDER_FAILED`, `TOO_MANY_PAGES`, `TOO_MANY_IMAGES`, `IMAGE_TOO_LARGE`, `IMAGE_UNSUPPORTED`, `RENDER_TIMEOUT` or `PDF_TOO_LARGE`; `details.block` is the block path, e.g. `blocks[3].rows`."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Busy:
      description: "`BUSY` (all render slots in use), `QUEUE_FULL` (RENDER_QUEUE_MAX jobs waiting, on POST /v1/renders) or `RATE_LIMITED`."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    MediaError:
      description: "`MEDIA_ERROR`: atc-media could not store or sign the file."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    JobId: { type: string, pattern: "^rnd_[0-9a-z]{6,12}[0-9a-f]{16}$", description: "Platform id format: `rnd_<time><random>`." }
    Job:
      type: object
      required: [id, status, template, version, filename, store, createdBy, createdAt, startedAt, finishedAt, pages, bytes, error, result]
      properties:
        id: { $ref: "#/components/schemas/JobId" }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        template: { type: string }
        version: { type: integer }
        filename: { type: string }
        store: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        pages: { type: [integer, "null"] }
        bytes: { type: [integer, "null"] }
        error:
          type: [object, "null"]
